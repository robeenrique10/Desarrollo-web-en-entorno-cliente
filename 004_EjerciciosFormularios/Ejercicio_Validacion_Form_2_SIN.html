<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8"/>
	<title>Validar Formularios - Ejercicio 2</title>
	<style type="text/css">
		span {
			color: red;
		}
	</style>
	<script src="Utilidades.js"></script>
	<script>

		function limpiarErrores() {
			document.getElementById('info_nombre').textContent = '';
			document.getElementById('info_apellidos').textContent = '';
			document.getElementById('info_dni').textContent = '';
			document.getElementById('info_sexo').textContent = '';
			document.getElementById('info_fecha').textContent = '';
			document.getElementById('info_estatura').textContent = '';
			document.getElementById('info_estado_civil').textContent = '';
			document.getElementById('info_bebidas').textContent = '';
			document.getElementById('info_ccc').textContent = '';
			document.getElementById('info_sugerencia').textContent = '';
		}

		function validarFormulario() {
			let esValido = true;
			limpiarErrores();

			// 1. Validar Nombre
			const nombre = document.getElementById('nombre').value;
			const resNombre = validarTexto(nombre, 2);
			if (!resNombre.valido) {
				document.getElementById('info_nombre').textContent = resNombre.msj;
				esValido = false;
			}

			// 2. Validar Apellidos
			const apellidos = document.getElementById('apellidos').value;
			const resApellidos = validarTexto(apellidos, 4);
			if (!resApellidos.valido) {
				document.getElementById('info_apellidos').textContent = resApellidos.msj;
				esValido = false;
			}

			// 3. Validar DNI
			const dni = document.getElementById('dni').value;
			const resDni = validarDNI(dni);
			if (!resDni.valido) {
				document.getElementById('info_dni').textContent = resDni.msj;
				esValido = false;
			}

			// 4. Validar Sexo
			const opcionesSexo = document.getElementsByName('sexo');
			let sexoSeleccionado = false;
			for (let i = 0; i < opcionesSexo.length; i++) {
				if (opcionesSexo[i].checked) {
					sexoSeleccionado = true;
					break;
				}
			}
			if (!sexoSeleccionado) {
				document.getElementById('info_sexo').textContent = "Debes seleccionar una opción de sexo.";
				esValido = false;
			}

			// 5. Validar Fecha
			const dia = document.getElementById('f_dia').value;
			const mes = document.getElementById('f_mes').value;
			const ano = document.getElementById('f_ano').value;
			const resFecha = validarFecha(dia, mes, ano);
			if (!resFecha.valido) {
				document.getElementById('info_fecha').textContent = resFecha.msj;
				esValido = false;
			}

			// 6. Validar Estatura
			const estatura = document.getElementById('estatura').value;
			const resEstatura = validarEstatura(estatura);
			if (!resEstatura.valido) {
				document.getElementById('info_estatura').textContent = resEstatura.msj;
				esValido = false;
			}

			// 7. Validar Estado Civil
			const estadoCivil = document.getElementById('estado_civil').value;
			if (estadoCivil === "-1") {
				document.getElementById('info_estado_civil').textContent = "Debes seleccionar tu estado civil.";
				esValido = false;
			}

			// 8. Validar Preferencias
			const bebidasMarcadas = document.querySelectorAll('input[name="bebidas"]:checked');
			if (bebidasMarcadas.length < 3) {
				document.getElementById('info_bebidas').textContent = `Debes seleccionar al menos 3 opciones (has marcado ${bebidasMarcadas.length}).`;
				esValido = false;
			}

			// 9. Validar Número de Cuenta Corriente
			const ccc = document.getElementById('ccc').value;
			const resCCC = validarCCC(ccc);
			if (!resCCC.valido) {
				document.getElementById('info_ccc').textContent = resCCC.msj;
				esValido = false;
			}

			// 10. Validar Sugerencia
			const sugerencia = document.getElementById('sugerencia').value;
			const resSugerencia = validarSugerencia(sugerencia);
			if (!resSugerencia.valido) {
				document.getElementById('info_sugerencia').textContent = resSugerencia.msj;
				esValido = false;
			}

			return esValido;
		}

		window.onload = function () {
			document.getElementById('nombre').focus();

			const form = document.getElementById('formulario_1');

			form.onsubmit = function () {
				return validarFormulario();
			};

			form.onreset = function () {
				limpiarErrores();
				setTimeout(() => document.getElementById('nombre').focus(), 0);
			};
		};

	</script>
</head>

<body>

<h1>Ejercicio Validación de Formularios</h1>
<form id="formulario_1">
	<p>
	<h3>Formulario de Registro:</h3>
	<label for="nombre">Nombre: </label>
	<input type="text" name="nombre" id="nombre" maxlength="25" size="15" />
	<span id="info_nombre"></span>
	<div>(Mínimo 2 letras)</div>
	<br><br>

	<label for="apellidos">Apellidos: </label>
	<input type="text" name="apellidos" id="apellidos" maxlength="50" size="25" />
	<span id="info_apellidos"></span>
	<div>(Mínimo 4 letras)</div>
	<br><br>

	<label for="dni">NIF: </label>
	<input type="text" name="dni" id="dni" maxlength="9" size="9" />
	<span id="info_dni"></span>
	<br><br><br>

	<label>Sexo: </label>
	<input type="radio" name="sexo" id="femenino" value="femenino" />
	<label for="femenino">Femenino</label>
	<input type="radio" name="sexo" id="masculino" value="masculino" />
	<label for="masculino">Masculino</label>
	<input type="radio" name="sexo" id="ni_me_acuerdo" value="ni_me_acuerdo" />
	<label for="ni_me_acuerdo">hace tanto que ni me acuerdo</label>
	<span id="info_sexo"></span>
	<br><br><br>

	<label for="f_dia">Fecha: </label>
	<input type="text" id="f_dia" maxlength="2" size="1" /> /
	<input type="text" id="f_mes" maxlength="2" size="1" /> /
	<input type="text" id="f_ano" maxlength="4" size="3" /> (dd/mm/aaaa)
	<span id="info_fecha"></span>
	<br><br><br>

	<label for="estatura">Estatura (en metros): </label>
	<input type="text" id="estatura" size="5" maxlength="7">
	<span id="info_estatura"></span>
	<br><br><br>

	<label for="estado_civil">Estado Civil: </label>
	<select id="estado_civil">
		<option value="-1">Selecciona una opción</option>
		<option value="1">Soltera/o</option>
		<option value="2">Casada/o</option>
		<option value="3">Separada/o</option>
		<option value="4">Divorciada/o</option>
		<option value="5">Pareja de hecho</option>
		<option value="6">En la gloria</option>
		<option value="7">Es complicado!!!!</option>
	</select>
	<span id="info_estado_civil"></span>
	<br><br><br>

	<div>Preferencias en zumos de cebada: </div>

	<ul>
		<li>
			<input type="checkbox" name="bebidas" id="paulaner" value="paulaner" />
			<label for="paulaner">Paulaner</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="coronita" value="coronita" />
			<label for="coronita">Coronita</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="cruzcampo" value="cruzcampo" />
			<label for="cruzcampo">Cruzcampo</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="desperados" value="desperados" />
			<label for="desperados">Desperados</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="grimbergen" value="grimbergen" />
			<label for="grimbergen">Grimbergen optimo bruno</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="judas" value="judas" />
			<label for="judas">Judas</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="lucifer" value="lucifer" />
			<label for="lucifer">Lucifer</label>
		</li>
		<li>
			<input type="checkbox" name="bebidas" id="ambar" value="ambar" />
			<label for="ambar">Ambar Export</label>
		</li>
	</ul>
	<span id="info_bebidas"></span>
	<div>(Mínimo 3 opciones)</div>
	<br><br>

	<label for="ccc">Número Cuenta Corriente: </label>
	<input type="text" name="ccc" id="ccc" maxlength="20" size="22" />
	<span id="info_ccc"></span>
	<div>(20 dígitos sin blancos)</div>
	<br><br><br>

	<label for="sugerencia">Alguna sugerencia: </label>
	<textarea id="sugerencia" name="sugerencia"></textarea>
	<span id="info_sugerencia"></span>
	<br><br>
	</p>
	<p><b>Todos los campos son obligatorios.</b></p>
	<br>
	<p>
		<input type="submit" value="ENVIAR" >
		<br><br>
		<input type="reset" value="Limpiar">
	</p>
</form>
</body>
</html>
